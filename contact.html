<!DOCTYPE html>
<html lang="nl-BE">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Senne Van Ginckel - project die hij heeft gemaakt</title>
    <meta name="description" content="Dit is een project van Senne Van Ginckel kom hier meer te weten over een project en hoe het werkt.">
    <link rel="stylesheet" href="css/tailwind.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="flex flex-col gap-3">
        <header class="flex flex-col gap-3 py-4 border-b border-gray-200 sm:flex-row items-center justify-between">
            <a href="index.html"><img src="images/site-logo.png" alt="Dit is het logo van de site van de webiste" height="50" width="50" class="bg-amber-950/40 text-amber-200 border border-amber-400/40 rounded-lg hover:bg-slate-950/40"></a>
            <nav>
                <ul class="flex flex-wrap gap-x-6 gap-y-2">
                    <li><a href="index.html" aria-current="page" class="bg-amber-950/40 text-amber-200 border border-amber-400/40 px-3 py-2 rounded-lg hover:bg-slate-950/40  hover:px-4 hover:py-3 ">Home</a></li>
                    <li><a href="portfolio.html" class="bg-amber-950/40 text-amber-200 border border-amber-400/40 px-3 py-2 rounded-lg hover:bg-slate-950/40  hover:px-4 hover:py-3 ">Portfolio</a></li>
                    <!-- <li><a href="project.html" class="bg-amber-950/40 text-amber-200 border border-amber-400/40 px-3 py-2 rounded-lg hover:bg-slate-950 hover:px-4 hover:py-3" >Project</a></li> -->
                    <li><a href="contact.html" class="bg-amber-950 text-amber-200 border border-amber-400/40 px-3 py-2 rounded-lg hover:bg-slate-950/40 hover:px-4 hover:py-3" >Contact</a></li>
                </ul>
            </nav>
            <a href="https://github.com/herosenne" target="_blank"><img src="images/github.png" alt="Dit is een link naar mijn github pagina" height="50" width="50" class="bg-amber-950/40 text-amber-200 border border-amber-400/40 rounded-lg hover:bg-slate-950/40"></a>
        </header>

        <main class="grid grid-cols-8 gap-4 p-4 max-w-7xl mx-auto">
            <section class="col-span-6 border-2 border-amber-400/40 bg-slate-950/20 rounded-lg mt-4 p-4 hover:bg-slate-950/40">
                <h1 class="text-3xl text-gray-200 pb-4">Contacteer mij</h1>
                <form name="contact" method="get" data-netlify="true" class="grid grid-cols-6 gap-4">

                    <div class="col-span-2">
                        <label for="voornaam" class="block font-medium text-gray-200">voornaam</label>
                        <input type="text" id="voornaam" name="voornaam" autocomplete="given-name" required class="mt-1 w-full rounded-lg border border-slate-950 bg-slate-950/20    px-3 py-2">
                    </div>

                    <div class="col-span-2">
                        <label for="achternaam" class="block font-medium text-gray-200">achternaam</label>
                        <input type="text" id="achternaam" name="achternaam" autocomplete="family-name" required class="mt-1 w-full rounded-lg border border-slate-950 bg-slate-950/20 px-3 py-2">
                    </div>

                    <div class="col-span-2">
                        <label for="text" class="block font-medium text-gray-200">Onderwerp</label>
                        <input type="text" id="onderwerp" name="onderwerp" required class="mt-1 w-full rounded-lg border border-slate-950 bg-slate-950/20 px-3 py-2">
                    </div>

                    <div class="col-span-6">
                        <label for="mail" class="block font-medium text-gray-200">e-mail</label>
                        <input type="email" id="mail" name="email" autocomplete="email" required class="mt-1 w-full rounded-lg border border-slate-950 bg-slate-950/20 px-3 py-2">
                    </div>

                    <div class="col-span-6">
                        <label for="text" class="block font-medium text-gray-200">Boodschap</label>
                        <textarea id="text" name="text" required class="mt-1 w-full rounded-lg border border-slate-950 bg-slate-950/20 px-3 py-2"></textarea>
                    </div>
                </form>
            </section>

            <section class="col-span-2 border-2 border-amber-400/40 bg-slate-950/20 rounded-lg mt-4 p-4 hover:bg-slate-950/40">
                <img src="images/site-logo.png" alt="Logo van de site" class="rounded-full border-slate-950 bg-slate-950/40">
                <a href="https://github.com/herosenne" class="flex flex-wrap gap-1 mt-4 underline decoration-gray-200 text-gray-200 hover:text-amber-200 hover:decoration-amber-200 "><img src="images/github.png" alt="Github logo" height="20" width="20"><p>Github/Senne Van Ginckel</p></a>
                <a href="https://github.com/herosenne" class="flex flex-wrap gap-1 mt-4 underline decoration-gray-200 text-gray-200 hover:text-amber-200 hover:decoration-amber-200 "><img src="images/linkedin.png" alt="Linkedin logo" height="20" width="20"><p>Linkedin/Senne Van Ginckel</p></a>
            </section>

            <aside class="col-span-8 border-2 border-amber-400/40 bg-slate-950/20 rounded-lg mt-4 p-4 hover:bg-slate-950/40">

            </aside>
        </main>

        

        <footer class="flex flex-row gap-3 border-t border-gray-200 items-center justify-between p-2 bg-slate-950/60 rounded-b-lg">
            <div class="ml-4">
                <p class="text-amber-200/90">Senne Van Gincel</p>
                <p class="text-slate-400 text-xs">Portfolio</p>
            </div>
            <a href="contact.html" class="px-3 py-2 rounded-lg hover:border hover:border-amber-400/40 hover:bg-slate-950 text-amber-200 hover:px-4 hover:py-3">mail mij</a>
            <p class="text-amber-200 text-sm mr-4 py-6"> &copy; 2026</p>
        </footer>
    
    </div>  

    
</body>
</html>
